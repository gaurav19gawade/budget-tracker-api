server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  cors:
    # Comma-separated. Set APP_CORS_ALLOWED_ORIGINS to the Vercel URL in Railway.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Supabase user id (UUID) of the one person allowed to create the first household.
  bootstrap-owner-user-id: ${BOOTSTRAP_OWNER_USER_ID:}
  teller:
    # AES-256 key for encrypting SimpleFin access URLs at rest.
    # Generate with: openssl rand -base64 32
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
  supabase:
    # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
    jwks-uri: ${SUPABASE_JWKS_URI:}
    # https://<project-ref>.supabase.co/auth/v1
    issuer: ${SUPABASE_ISSUER:}
    jws-algorithm: ${SUPABASE_JWS_ALGORITHM:ES256}

spring:
  application:
    name: budget-tracker-api
  datasource:
    # Supabase Postgres via the pooler. Example:
    # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # App tables live in their own schema, not Supabase's managed "public" schema.
      hibernate.default_schema: ${DB_SCHEMA:budget}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase's "public" is never empty, so Flyway can't own it. Use a dedicated schema;
    # the flyway_schema_history table is created there too.
    schemas: ${DB_SCHEMA:budget}
    default-schema: ${DB_SCHEMA:budget}
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
